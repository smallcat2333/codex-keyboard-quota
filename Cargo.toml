[package]
name = "codex_keyboard_quota_tool"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Display Codex usage limits on a TICKTYPE DP-104 keyboard on Windows."
repository = "https://github.com/smallcat2333/codex-keyboard-quota"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "CodexKeyboardQuotaTool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
fs2 = "0.4"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rquickjs = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
toml = "0.8"
winreg = "0.55"

[build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
